spring:
  config:
    activate:
      on-profile: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hopebidb}
    username: ${SPRING_DATASOURCE_USERNAME:hopebi_user}
    password: ${SPRING_DATASOURCE_PASSWORD:hopebi_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
