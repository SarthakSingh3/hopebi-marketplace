spring:
  config:
    activate:
      on-profile: prod

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hopebidb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:hopebi_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:hopebi_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HopebiHikariCP

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

hopebi:
  app:
    name: "HOPEBI"
    tagline: "Curated Indian B2C Marketplace"
    currency: "INR"
    currency-symbol: "₹"
    default-commission-percent: 5.0
    jwt:
      secret: ${HOPEBI_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000 # 24 hours
    payment:
      test-mode: ${PAYMENT_TEST_MODE:false}
      provider: ${PAYMENT_PROVIDER:RAZORPAY}
      razorpay:
        key-id: ${RAZORPAY_KEY_ID:}
        key-secret: ${RAZORPAY_KEY_SECRET:}
    sms:
      enabled: ${SMS_ENABLED:true}
      provider: ${SMS_PROVIDER:FAST2SMS}
      api-key: ${SMS_API_KEY:}
      sender-id: "HOPEBI"
    storage:
      provider: ${STORAGE_PROVIDER:CLOUDINARY} # CLOUDINARY | S3 | LOCAL
      cloudinary:
        cloud-name: ${CLOUDINARY_CLOUD_NAME:}
        api-key: ${CLOUDINARY_API_KEY:}
        api-secret: ${CLOUDINARY_API_SECRET:}
      s3:
        bucket: ${AWS_S3_BUCKET:}
        region: ${AWS_REGION:ap-south-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
