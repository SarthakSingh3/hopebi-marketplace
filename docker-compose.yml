version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hopebi-postgres
    environment:
      POSTGRES_DB: hopebidb
      POSTGRES_USER: hopebi_user
      POSTGRES_PASSWORD: hopebi_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopebi_user -d hopebidb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
