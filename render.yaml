services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: hopebi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore # Closest low-latency region to India
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: hopebi-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hopebi-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hopebi-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: hopebi-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hopebi-postgres
          property: password
      - key: HOPEBI_JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: hopebi-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hopebi-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: hopebi-postgres
    databaseName: hopebidb
    user: hopebi_user
    plan: free
    region: singapore
